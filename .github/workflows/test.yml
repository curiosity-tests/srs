    - name: Run SRS utest
      run: docker run --rm srs:test ./objs/srs_utest
      # For regression-test
    - name: Run SRS regression-test
      run: |
        docker run --rm srs:test bash -c './objs/srs -c conf/regression-test.conf && sleep 10 && \
            cd 3rdparty/srs-bench && (./objs/srs_test -test.v || (cat ../../objs/srs.log && exit 1))'
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

